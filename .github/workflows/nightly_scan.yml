name: Nightly Market Scan

on:
  schedule:
    - cron: "0 19 * * *"   # runs daily at 19:00 UTC (00:30 IST during standard time)
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run nightly scan
        run: |
          python nightly_scan.py

      - name: Commit updated scan results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add latest_scan_nifty50.csv latest_scan_niftynext50.csv price_cache_nifty50.csv price_cache_niftynext50.csv
          git commit -m "Nightly market scan update" || echo "No changes to commit"
          git push
