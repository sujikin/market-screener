name: Nightly Market Scan

on:
  schedule:
    - cron: "30 12 * * 1-5"   # runs weekdays at 12:30 UTC / 18:00 IST, after market close
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run nightly scan
        run: |
          python nightly_scan.py

      - name: Commit updated scan results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -f latest_scan_nifty50.csv latest_scan_niftynext50.csv price_cache_nifty50.csv price_cache_niftynext50.csv snapshot_meta_nifty50.json snapshot_meta_niftynext50.json fundamentals_cache_nifty50.json fundamentals_cache_niftynext50.json
          git commit -m "Nightly market scan update" || echo "No changes to commit"
          git push
